spring.application.name=tureserva
spring.profiles.active=dev

# Configuración de base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/TuReserva2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tio mono}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${DEBUG_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Configuración del servidor
server.port=${SERVER_PORT:8080}

# Configuración de HikariCP (Pool de conexiones)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuración de logging para desarrollo
logging.level.org.hibernate.SQL=${DEBUG_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${DEBUG_SQL:ERROR}
logging.level.com.example.tureserva=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# Configuración OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email