spring.application.name=tureserva
spring.profiles.active=dev

# Configuración de base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tureserva3}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tio mono}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${DEBUG_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Configuración del servidor
server.port=${SERVER_PORT:8080}

# Configuración de HikariCP (Pool de conexiones)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuración de logging para desarrollo
logging.level.org.hibernate.SQL=${DEBUG_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${DEBUG_SQL:ERROR}
logging.level.com.example.tureserva=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=INFO

# Configuración OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Configuración de correo (SMTP) - Gmail (usar variables de entorno en producción)
# Recomendado: exportar SMTP_USER y SMTP_PASSWORD en el entorno y no guardarlos en el repo.
spring.mail.host=smtp.gmail.com
# Usar puerto 465 (SSL) porque 587 (STARTTLS) está bloqueado en la red actual
spring.mail.port=465
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Timeouts ampliados para redes lentas
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Habilitar debug SMTP temporalmente para obtener más información en logs
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG

# Charset
spring.mail.default-encoding=UTF-8

# Nota: para usar Gmail con SMTP desde una app, usa una Contraseña de Aplicación
# y coloca su valor en la variable de entorno SMTP_PASSWORD. No uses la contraseña
# principal de tu cuenta. Ejemplo (PowerShell):
# $env:SMTP_USER = 'tu-correo@gmail.com'
# $env:SMTP_PASSWORD = 'krld saio lbgn wctb'  # contraseña de aplicación (ejemplo dado)
# if ($env:SMTP_USER) { 'SMTP_USER está definida' } else { 'SMTP_USER NO está definida' }
# if ($env:SMTP_PASSWORD) { 'SMTP_PASSWORD está definida' } else { 'SMTP_PASSWORD NO está definida' }