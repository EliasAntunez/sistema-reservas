<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Servicios Adicionales</title>

    <th:block layout:fragment="css">
        <style>
            .main-content { padding: 12px 0; }
            .table-container { max-height: 420px; overflow-y: auto; overflow-x: hidden; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
            .policy-table { width:100%; border-collapse: collapse; margin-bottom:0; }
            .policy-table th { background-color: #007bff; color: white; position: sticky; top:0; z-index:10; }
            .policy-table th, .policy-table td { padding:12px 15px; text-align:left; border-bottom:1px solid #eee; white-space: nowrap; }
            .selectable-row { cursor:pointer; transition: background-color 0.2s; }
            .selectable-row:hover { background-color:#e9f7ff; }
            .selectable-row.selected { background-color:#cce5ff; font-weight:600; border-left:5px solid #0056b3; }
            .actions { display:flex; justify-content:space-between; align-items:center; flex-wrap:nowrap; gap:10px; margin-bottom:30px; }
            #abm-actions { display:flex; gap:8px; flex-wrap:nowrap; align-items:center; }
        </style>
    </th:block>
</head>

<div layout:fragment="content" class="container main-content">
    <!-- Mensajes de alerta unificados -->
    <div th:if="${error}" class="alert alert-danger-unified alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${exito}" class="alert alert-success-unified alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${exito}">Operación exitosa</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex align-items-start mb-3">
        <div class="me-3">
            <a th:href="@{/admin-complejo/gestionar/{id}(id=${idComplejo})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Volver
            </a>
        </div>

        <h1 class="h2 mb-0 text-primary">
            <i class="bi bi-box-seam me-2"></i>
            Gestión de Servicios Adicionales
        </h1>
    </div>

    <div class="table-container">
        <table class="policy-table table table-hover table-striped">
            <thead>
                <tr>
                    <th><i class="bi bi-hash me-1"></i>ID</th>
                    <th><i class="bi bi-tag me-1"></i>Nombre</th>
                    <th><i class="bi bi-currency-dollar me-1"></i>Precio</th>
                    <th><i class="bi bi-wallet2 me-1"></i>Tipo de Cobro</th>
                    <th><i class="bi bi-grid-3x3-gap me-1"></i>Aplicable A</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="servicio : ${serviciosAdicionales}"
                    class="selectable-row"
                    th:data-id="${servicio.id}">
                    <td th:text="${servicio.id}">1</td>
                    <td th:text="${servicio.nombre}">Servicio</td>
                    <td th:text="${servicio.precio}">0.00</td>
                    <td th:text="${servicio.tipoDeCobro}">POR_HORA</td>
                    <td th:text="${servicio.aplicableA}">CANCHA</td>
                </tr>
                <tr th:if="${#lists.isEmpty(serviciosAdicionales)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay servicios adicionales registrados para este complejo.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="actions">
        <a th:href="@{/admin-complejo/servicios-adicionales/crear/{id}(id=${idComplejo})}" class="btn btn-success d-flex align-items-center">
            <i class="bi bi-plus-circle me-2"></i>Crear Nuevo Servicio
        </a>

        <div id="abm-actions">
            <button id="edit-button" class="btn btn-warning d-flex align-items-center" disabled>
                <i class="bi bi-pencil-square me-2"></i>Modificar
            </button>
            <button id="delete-button" class="btn btn-danger d-flex align-items-center" disabled>
                <i class="bi bi-trash me-2"></i>Eliminar
            </button>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const rows = document.querySelectorAll('.selectable-row');
            const editButton = document.getElementById('edit-button');
            const deleteButton = document.getElementById('delete-button');
            let selectedId = null;

            const csrfMeta = document.querySelector('meta[name="_csrf"]');
            const csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : null;

            rows.forEach(row => {
                row.addEventListener('click', () => {
                    const currentId = row.getAttribute('data-id');
                    if (row.classList.contains('selected')) {
                        row.classList.remove('selected');
                        selectedId = null;
                    } else {
                        rows.forEach(r => r.classList.remove('selected'));
                        row.classList.add('selected');
                        selectedId = currentId;
                    }
                    updateABMButtons();

                    const alerts = document.querySelectorAll('.alert-dismissible');
                    if (alerts && alerts.length) {
                        alerts.forEach(a => { setTimeout(() => { try { const bs = bootstrap.Alert.getOrCreateInstance(a); bs.close(); } catch(e) { a.style.display='none'; } }, 3000); });
                    }
                });
            });

            function updateABMButtons() {
                if (selectedId) {
                    editButton.disabled = false;
                    deleteButton.disabled = false;
                    editButton.onclick = () => { window.location.href = `/admin-complejo/servicios-adicionales/modificar/${selectedId}`; };
                    deleteButton.onclick = () => {
                        if (confirm(`¿Eliminar servicio adicional ID: ${selectedId}?`)) {
                            const form = document.createElement('form');
                            form.method = 'POST';
                            form.action = `/admin-complejo/servicios-adicionales/eliminar/${selectedId}`;
                            if (csrfToken) {
                                const input = document.createElement('input');
                                input.type = 'hidden'; input.name = '_csrf'; input.value = csrfToken;
                                form.appendChild(input);
                            }
                            document.body.appendChild(form);
                            form.submit();
                        }
                    };
                } else {
                    editButton.disabled = true; deleteButton.disabled = true;
                    editButton.onclick = null; deleteButton.onclick = null;
                }
            }

            updateABMButtons();
        });
    </script>
</th:block>
</html>
