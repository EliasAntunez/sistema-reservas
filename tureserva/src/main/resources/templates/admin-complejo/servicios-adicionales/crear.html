<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Crear Servicio Adicional - Administrador de Complejo</title>
</head>

<div layout:fragment="content" class="container main-content">
    <div class="row">
        <div class="col-lg-8 mx-auto">

            <div class="card">
                <div class="card-header bg-role text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-plus-circle me-2"></i>Crear Servicio Adicional
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin-complejo/servicios-adicionales/crear/{idComplejo}(idComplejo=${idComplejo})}" th:object="${servicioAdicional}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre del servicio" required maxlength="100"
                                   th:classappend="${#fields.hasErrors('nombre')}? ' is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" th:field="*{precio}" id="precio" class="form-control" placeholder="0.00" min="0" required
                                   th:classappend="${#fields.hasErrors('precio')}? ' is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tipoDeCobro" class="form-label">Tipo de cobro <span class="text-danger">*</span></label>
                            <select th:field="*{tipoDeCobro}" id="tipoDeCobro" class="form-select" required
                                    th:classappend="${#fields.hasErrors('tipoDeCobro')}? ' is-invalid' : ''">
                                <option th:each="t : ${T(com.example.tureserva.modelo.enums.TipoDeCobro).values()}" th:value="${t}" th:text="${t}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoDeCobro')}" th:errors="*{tipoDeCobro}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="aplicableA" class="form-label">Aplicable a <span class="text-danger">*</span></label>
                            <select th:field="*{aplicableA}" id="aplicableA" class="form-select" required
                                    th:classappend="${#fields.hasErrors('aplicableA')}? ' is-invalid' : ''">
                                <option th:each="a : ${T(com.example.tureserva.modelo.enums.AplicableA).values()}" th:value="${a}" th:text="${a}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('aplicableA')}" th:errors="*{aplicableA}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="maximoCantidad" class="form-label">Cantidad Máxima (opcional)</label>
                            <input type="number" th:field="*{maximoCantidad}" id="maximoCantidad" class="form-control"
                                   min="1" step="1" placeholder="Dejar vacío para sin límite"
                                   th:classappend="${#fields.hasErrors('maximoCantidad')}? ' is-invalid' : ''" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maximoCantidad')}" th:errors="*{maximoCantidad}"></div>
                            <div class="form-text">Si se indica, limita la cantidad máxima que un cliente puede solicitar por detalle.</div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
                            <label class="form-check-label" for="activo">Activo</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin-complejo/servicios-adicionales/listar/{id}(id=${idComplejo})}" class="btn btn-outline-secondary d-flex align-items-center">
                                <i class="bi bi-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary d-flex align-items-center">
                                <i class="bi bi-save me-2"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</html>
