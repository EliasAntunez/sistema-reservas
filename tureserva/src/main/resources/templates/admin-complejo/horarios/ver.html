<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}"> 
<head>
    <title layout:title-fragment>Horarios del Complejo</title>

    <th:block layout:fragment="css">
        <style>
            /* Contenedor principal del contenido */
            .main-content {
                padding: 30px 0;
            }

            /* Grilla Desplazable */
            .table-container {
                max-height: 400px; /* Altura máxima antes de scrollear */
                overflow-y: auto; /* Scroll vertical */
                overflow-x: hidden; /* Elimina el scroll horizontal en la grilla */
                border: 1px solid #ddd;
                border-radius: 8px;
                margin-bottom: 25px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            /* Estilos de la Tabla */
            .policy-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0;
            }

            .policy-table th {
                background-color: #007bff;
                color: white;
                position: sticky; /* Fija el encabezado */
                top: 0;
                z-index: 10;
            }
            
            .policy-table th, .policy-table td {
                padding: 12px 15px;
                text-align: left;
                border-bottom: 1px solid #eee;
                white-space: nowrap; 
            }

            /* Fila Seleccionable y Estado de Selección */
            .selectable-row {
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .selectable-row:hover {
                background-color: #e9f7ff;
            }

            .selectable-row.selected {
                background-color: #cce5ff;
                font-weight: 600;
                border-left: 5px solid #0056b3; 
            }

            /* Estilos de Botones de Acción (ABM) */
            .actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap; 
                gap: 10px;
                /* CORRECCIÓN: Agregamos margen inferior para separarlo del footer */
                margin-bottom: 30px; 
            }
            
            #abm-actions {
                /* FUERZA LA VISIBILIDAD DE LOS BOTONES DE MODIFICAR/ELIMINAR */
                display: flex !important; 
                gap: 10px;
            }
            
            .btn:disabled {
                cursor: not-allowed;
                opacity: 0.65;
            }
        </style>
    </th:block>
</head>
<body>
    <div layout:fragment="content" class="container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <h1 class="h2 mb-0 text-primary">
                <i class="fas fa-clock me-2"></i>
                Horarios de <span th:text="${complejo?.nombre_complejo}"></span>
            </h1>
            <div>
                <a th:href="@{/admin-complejo/gestionar/{id}(id=${complejo?.id_complejo})}" 
                   class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Volver
                </a>
            </div>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensajeInfo}" class="alert alert-info alert-dismissible fade show" role="alert">
            <span th:text="${mensajeInfo}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="fas fa-calendar me-2"></i>Horarios de Funcionamiento
                </h5>
                <form th:action="@{/admin-complejo/horarios/complejo/{id}/crear-defecto(id=${complejo?.id_complejo})}" 
                      method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-outline-primary btn-sm" 
                            th:if="${#lists.isEmpty(horarios)}"
                            onclick="return confirm('¿Desea crear horarios por defecto?')">
                        <i class="fas fa-magic me-1"></i>Crear Horarios por Defecto
                    </button>
                </form>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(horarios)}" class="text-center py-5">
                    <i class="fas fa-clock fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No hay horarios configurados</h5>
                    <p class="text-muted">Agregue horarios de funcionamiento para cada día de la semana.</p>
                </div>

                <div th:if="${not #lists.isEmpty(horarios)}" class="table-container">
                    <table class="policy-table table table-hover table-striped">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-calendar-day me-2"></i>Día</th>
                                <th><i class="fas fa-clock me-2"></i>Apertura</th>
                                <th><i class="fas fa-clock me-2"></i>Cierre</th>
                                <th>ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="horario : ${horarios}"
                                class="selectable-row"
                                th:data-id="${horario.id}"> 
                                <td>
                                    <span class="badge bg-primary" th:text="${horario.diaSemana}"></span>
                                </td>
                                <td>
                                    <i class="fas fa-clock me-2 text-success"></i>
                                    <span th:text="${#temporals.format(horario.horaApertura, 'HH:mm')}"></span>
                                </td>
                                <td>
                                    <i class="fas fa-clock me-2 text-danger"></i>
                                    <span th:text="${#temporals.format(horario.horaCierre, 'HH:mm')}"></span>
                                </td>
                                <td th:text="${horario.id}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="actions mt-3 mb-5"> <a th:href="@{/admin-complejo/horarios/complejo/{id}/nuevo(id=${complejo?.id_complejo})}" 
               class="btn btn-success d-flex align-items-center">
                <i class="fas fa-plus-circle me-2"></i>Crear Nuevo Horario
            </a>

            <div id="abm-actions"> 
                <button id="edit-button" class="btn btn-warning d-flex align-items-center" disabled>
                    <i class="fas fa-edit me-2"></i>Modificar
                </button>
                <button id="delete-button" class="btn btn-danger d-flex align-items-center" disabled>
                    <i class="fas fa-trash me-2"></i>Eliminar
                </button>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', () => {
                const rows = document.querySelectorAll('.selectable-row');
                const editButton = document.getElementById('edit-button');
                const deleteButton = document.getElementById('delete-button');
                
                let selectedHorarioId = null;

                // Obtener el token CSRF de las meta etiquetas añadidas en base.html
                const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeaderName = document.querySelector('meta[name="_csrf_header"]').content;

                rows.forEach(row => {
                    row.addEventListener('click', () => {
                        const currentId = row.getAttribute('data-id');
                        
                        // Lógica de selección/deselección
                        if (row.classList.contains('selected')) {
                            row.classList.remove('selected');
                            selectedHorarioId = null;
                        } else {
                            rows.forEach(r => r.classList.remove('selected'));
                            row.classList.add('selected');
                            selectedHorarioId = currentId;
                        }

                        updateABMButtons();
                    });
                });

                function updateABMButtons() {
                    if (selectedHorarioId) {
                        // HABILITAR botones
                        editButton.disabled = false;
                        deleteButton.disabled = false;

                        // 1. Modificar (GET)
                        editButton.onclick = () => {
                            window.location.href = `/admin-complejo/horarios/editar/${selectedHorarioId}`;
                        };
                        
                        // 2. Eliminar: CORRECCIÓN para usar POST y evitar el error 405
                        deleteButton.onclick = () => {
                            if (confirm(`¿Está seguro de que quiere eliminar el horario ID: ${selectedHorarioId}? Esta acción no se puede deshacer.`)) {
                                
                                // Crear un formulario dinámico y enviarlo como POST
                                const form = document.createElement('form');
                                form.method = 'POST';
                                form.action = `/admin-complejo/horarios/eliminar/${selectedHorarioId}`; 
                                
                                // Añadir el token CSRF
                                const csrfInput = document.createElement('input');
                                csrfInput.setAttribute('type', 'hidden');
                                csrfInput.setAttribute('name', '_csrf'); // Spring Security espera el nombre del parámetro
                                csrfInput.setAttribute('value', csrfToken); // Valor del token
                                
                                form.appendChild(csrfInput);
                                
                                document.body.appendChild(form);
                                form.submit();
                            }
                        };

                    } else {
                        // DESHABILITAR botones
                        editButton.disabled = true;
                        deleteButton.disabled = true;
                        
                        editButton.onclick = null;
                        deleteButton.onclick = null;
                    }
                }

                updateABMButtons();
            });
        </script>
    </th:block>
</body>
</html>
