<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Gestionar Complejo</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h3 mb-0">Gestionar Complejo</h1>
                        <a th:href="@{/admin-complejo/mis-complejos}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Volver a Mis Complejos
                        </a>
                    </div>

                    <!-- Alertas -->
                    <div th:if="${mensajeInfo}" class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="fas fa-info-circle me-2"></i>
                        <span th:text="${mensajeInfo}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${mensajeError}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Información del complejo -->
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-building me-2"></i>
                                <span th:text="${complejo?.nombre_complejo}"></span>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-info-circle me-2"></i>Información Básica
                                    </h6>
                                    <p class="mb-2">
                                        <strong>Nombre:</strong> 
                                        <span th:text="${complejo?.nombre_complejo}"></span>
                                    </p>
                                    <p class="mb-2">
                                        <strong>Dirección:</strong> 
                                        <span th:text="${complejo?.direccion_complejo}"></span>
                                    </p>
                                    <p class="mb-0">
                                        <strong>Estado:</strong>
                                        <span th:if="${complejo?.activo}" class="badge bg-success ms-2">
                                            <i class="fas fa-check-circle me-1"></i>Activo
                                        </span>
                                        <span th:unless="${complejo?.activo}" class="badge bg-danger ms-2">
                                            <i class="fas fa-times-circle me-1"></i>Inactivo
                                        </span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-map-marker-alt me-2"></i>Ubicación
                                    </h6>
                                    <p class="mb-2">
                                        <strong>Localidad:</strong> 
                                        <span th:text="${complejo?.localidad?.nombre ?: 'N/A'}"></span>
                                    </p>
                                    <p class="mb-2">
                                        <strong>Provincia:</strong> 
                                        <span th:text="${complejo?.provincia?.nombre ?: 'N/A'}"></span>
                                    </p>
                                    <p class="mb-0">
                                        <strong>País:</strong> 
                                        <span th:text="${complejo?.pais?.nombre ?: 'N/A'}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Funcionalidades próximamente -->
                    <div class="row mt-4">
                        <div class="col-md-6 mb-3">
                            <div class="card h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-clock fa-3x text-muted mb-3"></i>
                                    <h5 class="card-title">Gestión de Horarios</h5>
                                    <p class="card-text text-muted">
                                        ABM de horarios del complejo deportivo
                                    </p>
                                    <button class="btn btn-primary" disabled>
                                        <i class="fas fa-cogs me-2"></i>Próximamente
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card h-100">
                                <div class="card-body text-center">
                                    <i class="fas fa-edit fa-3x text-muted mb-3"></i>
                                    <h5 class="card-title">Editar Datos Básicos</h5>
                                    <p class="card-text text-muted">
                                        Modificar información del complejo
                                    </p>
                                    <button class="btn btn-primary" disabled>
                                        <i class="fas fa-edit me-2"></i>Próximamente
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
