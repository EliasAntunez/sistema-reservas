<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Editar Perfil - Administrador de Complejo</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4">

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-edit me-2"></i>Editar Mi Perfil - Administrador de Complejo
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin-complejo/perfil/editar}" th:object="${adminComplejo}" method="post" novalidate>
                            <!-- Token CSRF para seguridad -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label">
                                        <i class="fas fa-user me-1"></i>Nombre <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           th:field="*{nombre}"
                                           th:class="${#fields.hasErrors('nombre')} ? 'form-control is-invalid' : 'form-control'"
                                           id="nombre" 
                                           placeholder="Ingresa tu nombre"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                                        Error en el nombre
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label">
                                        <i class="fas fa-user me-1"></i>Apellido <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           th:field="*{apellido}"
                                           th:class="${#fields.hasErrors('apellido')} ? 'form-control is-invalid' : 'form-control'"
                                           id="apellido" 
                                           placeholder="Ingresa tu apellido"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">
                                        Error en el apellido
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-1"></i>Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" 
                                           class="form-control" 
                                           th:field="*{email}"
                                           th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                                           id="email" 
                                           placeholder="tu@email.com"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                        Error en el email
                                    </div>
                                    <div class="form-text">
                                        <i class="fas fa-info-circle me-1"></i>
                                        Si cambias tu email, tendrás que usarlo para iniciar sesión la próxima vez.
                                    </div>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label for="dni" class="form-label">
                                        <i class="fas fa-id-card me-1"></i>DNI <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           th:field="*{dni}"
                                           th:class="${#fields.hasErrors('dni')} ? 'form-control is-invalid' : 'form-control'"
                                           id="dni" 
                                           placeholder="12345678"
                                           pattern="[0-9]{7,8}"
                                           title="Solo números, entre 7 y 8 dígitos"
                                           minlength="7"
                                           maxlength="8"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">
                                        Error en el DNI
                                    </div>
                                    <div class="form-text">
                                        <i class="fas fa-info-circle me-1"></i>
                                        Solo números, entre 7 y 8 dígitos (obligatorio)
                                    </div>
                                </div>
                            </div>

                            <!-- Información adicional -->
                            <div class="alert alert-info alert-dismissible fade show" role="alert">
                                <i class="fas fa-calendar-check me-2"></i>
                                <strong>Fecha de registro:</strong> 
                                <span th:text="${#temporals.format(adminComplejo.fechaRegistro, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between">
                                <a href="/admin-complejo/perfil" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-info">
                                    <i class="fas fa-check me-2"></i>Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
