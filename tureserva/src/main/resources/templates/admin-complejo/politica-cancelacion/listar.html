
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title layout:title-fragment>Políticas de Cancelación</title>
    <th:block layout:fragment="css">
        <style>
            .main-content { padding: 30px 0; }
            .table-container { max-height: 400px; overflow-y: auto; overflow-x: hidden; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
            .policy-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
            .policy-table th { background-color: #007bff; color: white; position: sticky; top: 0; z-index: 10; }
            .policy-table th, .policy-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
            .selectable-row { cursor: pointer; transition: background-color 0.2s; }
            .selectable-row:hover { background-color: #e9f7ff; }
            .selectable-row.selected { background-color: #cce5ff; font-weight: 600; border-left: 5px solid #0056b3; }
            .actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
            #abm-actions { display: flex !important; gap: 10px; }
            .btn:disabled { cursor: not-allowed; opacity: 0.65; }
        </style>
    </th:block>
</head>

<div layout:fragment="content" class="container main-content">
    <!-- Mensajes de error y éxito -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Gestión de Políticas de Cancelación</h2>
    </div>

    <div class="table-container">
        <table class="policy-table table table-hover table-striped">
            <thead>
                <tr>
                    <th><i class="bi bi-tag me-1"></i>ID</th>
                    <th><i class="bi bi-journal-text me-1"></i>Nombre</th>
                    <th><i class="bi bi-clock me-1"></i>Horas Anticipación Mínima</th>
                    <th><i class="bi bi-percent me-1"></i>% Devolución</th>
                    <th><i class="bi bi-calendar-check me-1"></i>Fecha Inicio</th>
                    <th><i class="bi bi-calendar-x me-1"></i>Fecha Fin</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="politica : ${politicasCancelacion}"
                    class="selectable-row"
                    th:data-id="${politica.id}">
                    <td th:text="${politica.id}"></td>
                    <td th:text="${politica.nombre}"></td>
                    <td th:text="${politica.horasAnticipacionMinima}"></td>
                    <td th:text="${politica.porcentajeDevolucion}"></td>
                    <td th:text="${politica.fechaInicioVigencia}"></td>
                    <td th:text="${politica.fechaFinVigencia}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(politicasCancelacion)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No hay políticas de cancelación registradas para este complejo.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="actions">
        <a th:href="@{/admin-complejo/politicas-cancelacion/crear/{id}(id=${complejoId})}"
           class="btn btn-success d-flex align-items-center">
            <i class="bi bi-plus-circle me-2"></i>Crear Nueva Política
        </a>

        <div id="abm-actions">
            <button id="edit-button" class="btn btn-warning d-flex align-items-center" disabled>
                <i class="bi bi-pencil-square me-2"></i>Modificar
            </button>
            <button id="delete-button" class="btn btn-danger d-flex align-items-center" disabled>
                <i class="bi bi-trash me-2"></i>Eliminar
            </button>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const rows = document.querySelectorAll('.selectable-row');
            const editButton = document.getElementById('edit-button');
            const deleteButton = document.getElementById('delete-button');
            let selectedPolicyId = null;
            // Obtener el token CSRF para peticiones POST seguras (Necesario para Spring Security)
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            rows.forEach(row => {
                row.addEventListener('click', () => {
                    const currentId = row.getAttribute('data-id');
                    if (row.classList.contains('selected')) {
                        row.classList.remove('selected');
                        selectedPolicyId = null;
                    } else {
                        rows.forEach(r => r.classList.remove('selected'));
                        row.classList.add('selected');
                        selectedPolicyId = currentId;
                    }
                    updateABMButtons();
                });
            });
            function updateABMButtons() {
                if (selectedPolicyId) {
                    editButton.disabled = false;
                    deleteButton.disabled = false;
                    // Modificar (GET)
                    editButton.onclick = () => {
                        window.location.href = `/admin-complejo/politicas-cancelacion/modificar/${selectedPolicyId}`;
                    };
                    // Eliminar (POST)
                    deleteButton.onclick = () => {
                        if (confirm(`¿Está seguro de que quiere eliminar la política de cancelación ID: ${selectedPolicyId}?`)) {
                            const form = document.createElement('form');
                            form.method = 'POST';
                            form.action = `/admin-complejo/politicas-cancelacion/eliminar/${selectedPolicyId}`;
                            // CSRF
                            if (csrfToken) {
                                const csrfInput = document.createElement('input');
                                csrfInput.setAttribute('type', 'hidden');
                                csrfInput.setAttribute('name', '_csrf');
                                csrfInput.setAttribute('value', csrfToken);
                                form.appendChild(csrfInput);
                            }
                            // complejoId
                            const complejoInput = document.createElement('input');
                            complejoInput.setAttribute('type', 'hidden');
                            complejoInput.setAttribute('name', 'complejoId');
                            complejoInput.setAttribute('value', document.querySelector('[name="complejoId"]')?.value || "${complejoId}");
                            form.appendChild(complejoInput);
                            document.body.appendChild(form);
                            form.submit();
                        }
                    };
                } else {
                    editButton.disabled = true;
                    deleteButton.disabled = true;
                    editButton.onclick = null;
                    deleteButton.onclick = null;
                }
            }
            updateABMButtons();
        });
    </script>
</th:block>
</html>
