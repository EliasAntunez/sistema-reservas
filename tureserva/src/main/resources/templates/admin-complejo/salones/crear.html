<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}">
<head>
    <title layout:title-fragment>Crear Salón</title>
    <th:block layout:fragment="css">
        <style>
            .form-container { max-width: 800px; margin: 20px auto; }
        </style>
    </th:block>
</head>

<div layout:fragment="content" class="container main-content form-container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h2 class="h4 mb-0 d-flex align-items-center">
                <i class="bi bi-plus-circle me-2"></i>Crear Nuevo Salón
            </h2>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin-complejo/salones/crear}" th:object="${salon}" method="post">
                <input type="hidden" name="idComplejo" th:value="${idComplejo}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" 
                           placeholder="Ej: Salón Principal" 
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" 
                           maxlength="100"
                           required>
                    <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="invalid-feedback"></div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label for="capacidad" class="form-label fw-bold">Capacidad</label>
                        <input type="number" id="capacidad" class="form-control" th:field="*{capacidad}" 
                               placeholder="Ej: 50"
                               th:classappend="${#fields.hasErrors('capacidad')} ? 'is-invalid' : ''"
                               required>
                        <div th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}" class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="precioPorHora" class="form-label fw-bold">Precio por Hora ($)</label>
                        <input type="number" id="precioPorHora" class="form-control" th:field="*{precioPorHora}" 
                               step="0.01" placeholder="Ej: 200.00"
                               th:classappend="${#fields.hasErrors('precioPorHora')} ? 'is-invalid' : ''"
                               required>
                        <div th:if="${#fields.hasErrors('precioPorHora')}" th:errors="*{precioPorHora}" class="invalid-feedback"></div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label for="metrosCuadrados" class="form-label fw-bold">Metros Cuadrados</label>
                        <input type="number" id="metrosCuadrados" class="form-control" th:field="*{metrosCuadrados}" 
                               placeholder="Ej: 120"
                               min="1"
                               th:classappend="${#fields.hasErrors('metrosCuadrados')} ? 'is-invalid' : ''"
                               required>
                        <div th:if="${#fields.hasErrors('metrosCuadrados')}" th:errors="*{metrosCuadrados}" class="invalid-feedback"></div>
                    </div>
                    <div class="col-md-6 mb-3 d-flex align-items-center pt-4">
                        <div class="form-check form-switch fs-5">
                            <input class="form-check-input" type="checkbox" role="switch" id="estaClimatizado" th:field="*{estaClimatizado}">
                            <label class="form-check-label" for="estaClimatizado">¿Climatizado?</label>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/admin-complejo/espacios/listar/{id}(id=${idComplejo})}" class="btn btn-secondary d-flex align-items-center">
                        <i class="bi bi-x-circle me-2"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-success d-flex align-items-center">
                        <i class="bi bi-check-circle me-2"></i>Guardar Salón
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
