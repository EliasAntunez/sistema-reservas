<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Dashboard - Administrador de Complejo</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4 role-admin-complejo">
        <div class="row">
            <!-- Bienvenida -->
            <div class="col-12">
                <div class="jumbotron bg-role text-white p-5 rounded shadow-sm mb-4">
                    <h1 class="display-4">
                        <i class="bi bi-building me-3"></i>¡Bienvenido Administrador!
                    </h1>
                    <p class="lead">
                        Panel de administración de complejos deportivos
                    </p>
                    <hr class="my-4">
                    <p><i class="bi bi-gear-wide-connected me-2"></i>Desde aquí podrás gestionar tus complejos, reservas y configurar tu perfil.</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- Panel de gestión -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-building fa-3x text-role mb-3"></i>
                        <h5>Mis Complejos</h5>
                        <p class="text-muted">Gestionar complejos deportivos</p>
                        <button class="btn btn-role" disabled>
                            Próximamente
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-calendar-check fa-3x text-success mb-3"></i>
                        <h5>Reservas</h5>
                        <p class="text-muted">Ver y gestionar reservas</p>
                        <button class="btn btn-success" disabled>
                            Próximamente
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-user-cog fa-3x text-role-accent mb-3"></i>
                        <h5>Mi Perfil</h5>
                        <p class="text-muted">Configurar perfil</p>
                        <a href="/admin-complejo/perfil" class="btn btn-role-accent">
                            Ver Perfil
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Mensajes de alerta -->
        <div class="row mt-4" th:if="${error}">
            <div class="col-12">
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span th:text="${error}">Error</span>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
