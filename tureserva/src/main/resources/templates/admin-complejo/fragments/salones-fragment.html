<div id="lista-salones-container" th:fragment="contenido-actualizable">
    <style>
        /* Scoped styles for salones fragment to ensure selection and scrolling when loaded via AJAX */
        #lista-salones-container .table-container {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            background: #fff;
        }
        #lista-salones-container .salones-table th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #lista-salones-container .salones-table th, #lista-salones-container .salones-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }
        #lista-salones-container .selectable-row { cursor: pointer; transition: background-color .15s ease; }
        #lista-salones-container .selectable-row:hover { background-color: #f1fbff; }
        #lista-salones-container .selectable-row.selected { background-color: #e6f2ff; font-weight: 600; border-left: 4px solid #0d6efd; }
    </style>

    <div class="table-container">
        <table class="salones-table table table-hover table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Capacidad</th>
                    <th>Precio por Hora</th>
                    <th>Metros Cuadrados</th>
                    <th>¿Climatizado?</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="salon : ${salonesPage.content}"
                    class="selectable-row"
                    th:data-id="${salon.id}">
                    <td th:text="${salon.nombre}"></td>
                    <td th:text="${salon.capacidad}"></td>
                    <td th:text="${salon.precioPorHora}"></td>
                    <td th:text="${salon.metrosCuadrados}"></td>
                    <td th:text="${salon.estaClimatizado} ? 'Sí' : 'No'"></td>
                </tr>
                <tr th:if="${salonesPage.content.size() == 0}">
                    <td colspan="5" class="text-center text-muted py-4">No hay salones registrados para este complejo.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${salonesPage.totalPages} > 1" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${salonesPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin-complejo/salones/listar/{idComplejo}(idComplejo=${idComplejo}, page=${salonesPage.number})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, salonesPage.totalPages)}" th:classappend="${i == salonesPage.number + 1} ? 'active'">
                <a class="page-link" th:href="@{/admin-complejo/salones/listar/{idComplejo}(idComplejo=${idComplejo}, page=${i})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${salonesPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin-complejo/salones/listar/{idComplejo}(idComplejo=${idComplejo}, page=${salonesPage.number + 2})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <div class="actions mt-3 mb-5 d-flex justify-content-between align-items-center flex-nowrap">
        <div class="left-actions">
            <a th:href="@{/admin-complejo/salones/crear/{id}(id=${idComplejo})}" class="btn btn-success d-flex align-items-center">
                <i class="bi bi-plus-circle me-2"></i>Crear Salón
            </a>
        </div>
        <div id="abm-actions-salones" class="d-flex gap-2">
            <button id="edit-button-salones-fragment" class="btn btn-warning d-flex align-items-center" disabled>
                <i class="bi bi-pencil-square me-2"></i>Modificar
            </button>
            <button id="delete-button-salones-fragment" class="btn btn-danger d-flex align-items-center" disabled>
                <i class="bi bi-trash me-2"></i>Eliminar
            </button>
        </div>
    </div>
</div>
