<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}">
<head>
    <title layout:title-fragment>Espacios del Complejo</title>
</head>

<div layout:fragment="content" class="container main-content">
    <!-- Contenedor para mensajes flash (usado por showFlash y por mensajes del servidor) -->
    <div id="alert-container">
        <div th:if="${error}" class="alert alert-danger-unified alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${exito}" class="alert alert-success-unified alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <!-- Compatibilidad: algunos controladores usan 'mensaje' o 'mensajeExito' como clave -->
        <div th:if="${mensaje}" class="alert alert-success-unified alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeExito}" class="alert alert-success-unified alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="d-flex align-items-start mb-3 mt-4">
        <div class="me-3">
            <a th:href="@{/admin-complejo/gestionar/{id}(id=${idComplejo})}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>

        <h1 class="h2 mb-0 text-primary">
            <i class="fas fa-door-open me-2"></i>
            Gestión de Espacios
        </h1>
    </div>

    <ul class="nav nav-tabs" id="tabs-espacios" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-canchas" data-bs-toggle="tab" data-bs-target="#pane-canchas" type="button" role="tab" aria-controls="pane-canchas" aria-selected="true">Canchas</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-salones" data-bs-toggle="tab" data-bs-target="#pane-salones" type="button" role="tab" aria-controls="pane-salones" aria-selected="false">Salones</button>
        </li>
    </ul>

    <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="pane-canchas" role="tabpanel" aria-labelledby="tab-canchas">
            <div id="canchas-tab-content">
                <!-- Canchas se cargarán vía AJAX aquí -->
            </div>
        </div>
        <div class="tab-pane fade" id="pane-salones" role="tabpanel" aria-labelledby="tab-salones">
            <div id="salones-tab-content">
                <!-- Salones se cargarán vía AJAX cuando el usuario seleccione la pestaña -->
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        const idComplejo = /*[[${idComplejo}]]*/ '0';

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

        function fetchFragment(url, containerSelector) {
            const container = document.querySelector(containerSelector);
            if (!container) return;
            container.classList.add('loading');
            // pequeño spinner
            container.innerHTML = '<div class="text-center py-4"><div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div></div>';

            fetch(url, {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(resp => {
                if (!resp.ok) throw new Error('Error al cargar contenido');
                return resp.text();
            })
            .then(html => {
                container.innerHTML = html;
                // Inicializa behaviors genéricos
                initFragmentBehaviors(container);
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<div class="alert alert-danger">Error al cargar el contenido.</div>';
            })
            .finally(() => container.classList.remove('loading'));
        }

        function initFragmentBehaviors(container) {
            // Selección de filas
            const rows = container.querySelectorAll('.selectable-row');
            let selectedId = null;
            // Auto-dismiss any alerts inside the loaded fragment (useful for AJAX-loaded fragments)
            try {
                const fragmentAlerts = container.querySelectorAll('.alert-dismissible');
                fragmentAlerts.forEach(alertEl => {
                    // ensure close button exists
                    if (!alertEl.querySelector('.btn-close')) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn-close';
                        btn.setAttribute('data-bs-dismiss', 'alert');
                        btn.setAttribute('aria-label', 'Close');
                        alertEl.appendChild(btn);
                    }
                    // auto close after 3s
                    setTimeout(() => {
                        try {
                            if (window.bootstrap && bootstrap.Alert) {
                                const bsAlert = bootstrap.Alert.getOrCreateInstance(alertEl);
                                bsAlert.close();
                            } else {
                                alertEl.style.display = 'none';
                            }
                        } catch (e) { /* ignore */ }
                    }, 3000);
                });
            } catch (e) { /* ignore */ }
            rows.forEach(row => {
                row.addEventListener('click', () => {
                    if (row.classList.contains('selected')) {
                        row.classList.remove('selected');
                        selectedId = null;
                    } else {
                        rows.forEach(r => r.classList.remove('selected'));
                        row.classList.add('selected');
                        selectedId = row.getAttribute('data-id');
                    }
                    updateFragmentABMButtons(container, selectedId);
                });
            });

            // Paginación AJAX: enlaces con clase page-link
            const paginationLinks = container.querySelectorAll('.page-link');
            paginationLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const url = link.href;
                    if (!url) return;
                    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }})
                        .then(r => r.text())
                        .then(html => {
                            container.innerHTML = html;
                            initFragmentBehaviors(container);
                        })
                        .catch(err => console.error('Error paginación AJAX', err));
                });
            });

            // Inicializa ABM: busca botones de edit/delete dentro del document (pueden estar fuera del fragment)
            updateFragmentABMButtons(container, null);
        }

        function updateFragmentABMButtons(container, selectedId) {
            // Determinar qué pestaña está activa buscando dentro del container
            const isInCanchas = container.closest('#pane-canchas') !== null;
            const isInSalones = container.closest('#pane-salones') !== null;
            
            // Buscar botones DENTRO del fragmento cargado (no globalmente)
            let gestionarBtn = null;
            let editBtn = null;
            let deleteBtn = null;
            
            if (isInCanchas) {
                gestionarBtn = container.querySelector('#gestionar-button');
                editBtn = container.querySelector('#edit-button');
                deleteBtn = container.querySelector('#delete-button');
            } else if (isInSalones) {
                gestionarBtn = container.querySelector('#gestionar-button-salones-fragment');
                editBtn = container.querySelector('#edit-button-salones-fragment');
                deleteBtn = container.querySelector('#delete-button-salones-fragment');
            }

            if (gestionarBtn) {
                if (selectedId) {
                    gestionarBtn.disabled = false;
                    gestionarBtn.onclick = () => {
                        window.location.href = `/admin-complejo/espacios/gestionar/${selectedId}`;
                    };
                } else {
                    gestionarBtn.disabled = true;
                    gestionarBtn.onclick = null;
                }
            }

            if (editBtn) {
                if (selectedId) {
                    editBtn.disabled = false;
                    editBtn.onclick = () => {
                        if (isInCanchas) {
                            window.location.href = `/admin-complejo/canchas/modificar/${selectedId}`;
                        } else {
                            window.location.href = `/admin-complejo/salones/modificar/${selectedId}`;
                        }
                    };
                } else {
                    editBtn.disabled = true;
                    editBtn.onclick = null;
                }
            }

            if (deleteBtn) {
                if (selectedId) {
                    deleteBtn.disabled = false;
                    deleteBtn.onclick = () => {
                        if (!confirm('¿Está seguro que desea eliminar el elemento seleccionado?')) return;
                        const base = isInCanchas ? '/admin-complejo/canchas' : '/admin-complejo/salones';
                        const url = `${base}/eliminar/${selectedId}`;
                        fetch(url, {
                            method: 'DELETE',
                            headers: Object.assign({ 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }, (csrfHeader && csrfToken) ? { [csrfHeader]: csrfToken } : {}),
                            body: JSON.stringify({})
                        })
                        .then(r => r.json().then(body => ({ status: r.status, body })))
                        .then(({ status, body }) => {
                            if (status >= 200 && status < 300) {
                                const row = container.querySelector(`tr[data-id="${selectedId}"]`);
                                if (row) row.remove();
                                showFlash(body.message || 'Eliminado', 'success');
                            } else {
                                throw new Error(body.message || 'Error al eliminar');
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            showFlash(err.message || 'Error al eliminar', 'danger');
                        });
                    };
                } else {
                    deleteBtn.disabled = true;
                    deleteBtn.onclick = null;
                }
            }
        }

        function showFlash(message, type) {
            const container = document.getElementById('alert-container');
            if (!container) return;
            const div = document.createElement('div');
                // Mapear tipos a las clases unificadas usadas por las plantillas
                const unifiedClass = type === 'success' ? 'alert-success-unified' : (type === 'danger' ? 'alert-danger-unified' : `alert-${type}`);
                div.className = `alert ${unifiedClass} alert-dismissible fade show`;
                // Añadir un icono representativo según el tipo
                const icon = type === 'success' ? '<i class="bi bi-check-circle-fill me-2"></i>' : (type === 'danger' ? '<i class="bi bi-exclamation-triangle-fill me-2"></i>' : '');
                div.innerHTML = `${icon}${message} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
                container.appendChild(div);
                // Auto-cerrar: usar Bootstrap si está disponible para que elimine el nodo y no deje hueco
                setTimeout(() => {
                    try {
                        if (window.bootstrap && bootstrap.Alert) {
                            const bsAlert = bootstrap.Alert.getOrCreateInstance(div);
                            bsAlert.close(); // esto remueve el elemento del DOM
                        } else {
                            // Fallback: eliminar el nodo directamente
                            if (div && div.parentNode) div.parentNode.removeChild(div);
                        }
                    } catch (e) {
                        try { if (div && div.parentNode) div.parentNode.removeChild(div); } catch(_) {}
                    }
                }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Detectar si se debe activar la pestaña de salones desde el parámetro URL
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab');
            
            const tabCanchas = document.getElementById('tab-canchas');
            const tabSalones = document.getElementById('tab-salones');
            const paneCanchas = document.getElementById('pane-canchas');
            const paneSalones = document.getElementById('pane-salones');
            let salonesLoaded = false;
            let canchasLoaded = false;
            
            if (activeTab === 'salones' && tabSalones) {
                // Activar pestaña de salones
                tabCanchas.classList.remove('active');
                tabCanchas.setAttribute('aria-selected', 'false');
                tabSalones.classList.add('active');
                tabSalones.setAttribute('aria-selected', 'true');
                
                paneCanchas.classList.remove('show', 'active');
                paneSalones.classList.add('show', 'active');
                
                // Cargar salones inmediatamente
                const salonesUrl = `/admin-complejo/salones/listar/${idComplejo}`;
                fetchFragment(salonesUrl, '#salones-tab-content');
                salonesLoaded = true;
            } else {
                // carga inicial por defecto: canchas
                const canchasUrl = `/admin-complejo/canchas/listar/${idComplejo}`;
                fetchFragment(canchasUrl, '#canchas-tab-content');
                canchasLoaded = true;
            }

            // lazy load canchas on tab click (si no se ha cargado ya)
            if (tabCanchas) {
                tabCanchas.addEventListener('click', () => {
                    if (!canchasLoaded) {
                        const canchasUrl = `/admin-complejo/canchas/listar/${idComplejo}`;
                        fetchFragment(canchasUrl, '#canchas-tab-content');
                        canchasLoaded = true;
                    }
                });
            }

            // lazy load salones on tab click (si no se ha cargado ya)
            if (tabSalones) {
                tabSalones.addEventListener('click', () => {
                    if (!salonesLoaded) {
                        const salonesUrl = `/admin-complejo/salones/listar/${idComplejo}`;
                        fetchFragment(salonesUrl, '#salones-tab-content');
                        salonesLoaded = true;
                    }
                });
            }
        });
    </script>
</th:block>

</html>
