<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Iniciar Sesión</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px;">
                    <div class="card-body p-4">
                        <!-- Título del formulario -->
                        <div class="text-center mb-4">
                            <h1 class="fw-light mb-3" style="font-size: 2.5rem; font-family: 'Segoe UI', system-ui, sans-serif;">TuReserva</h1>
                            <p class="text-muted" style="font-size: 16px; color: #8e8e8e;">Inicia sesión en tu cuenta</p>
                        </div>
                        
                        <!-- Mensaje de error si las credenciales son incorrectas -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #ed4956; background-color: #ffeef0;">
                            <span style="color: #ed4956; font-size: 14px;">Email o contraseña incorrectos</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Mensaje de éxito después del logout -->
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #00ba7c; background-color: #f0fdf4;">
                            <span style="color: #00ba7c; font-size: 14px;">Sesión cerrada exitosamente</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Formulario de login -->
                        <form th:action="@{/login}" method="post">
                            <!-- Campo Email -->
                            <div class="mb-3">
                                <input type="email" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Correo electrónico"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       required>
                            </div>
                            
                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Contraseña"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       required>
                            </div>
                            
                            <!-- Botón de login -->
                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary"
                                        style="background-color: #0095f6; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; height: 44px;">
                                    Iniciar sesión
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Enlaces adicionales -->
                <div class="text-center mt-4">
                    <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px; padding: 20px;">
                        <p class="mb-0" style="color: #262626; font-size: 14px;">
                            ¿No tienes una cuenta? 
                            <a th:href="@{/usuarios/registro}" class="text-decoration-none" style="color: #0095f6; font-weight: 600;">
                                Regístrate
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
