<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Iniciar Sesión</title>
    <style>
        .btn-google:hover {
            background-color: #f8f9fa !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .form-control:focus {
            border-color: #0095f6;
            box-shadow: 0 0 0 0.2rem rgba(0, 149, 246, 0.15);
        }
    </style>
</head>

<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px;">
                    <div class="card-body p-4">
                        <!-- Título del formulario -->
                        <div class="text-center mb-4">
                            <h1 class="fw-light mb-3" style="font-size: 2.5rem; font-family: 'Segoe UI', system-ui, sans-serif;">TuReserva</h1>
                            <p class="text-muted" style="font-size: 16px; color: #8e8e8e;">Inicia sesión en tu cuenta</p>
                        </div>
                        
                        <!-- Mensaje de error si las credenciales son incorrectas -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #ed4956; background-color: #ffeef0;">
                            <span style="color: #ed4956; font-size: 14px;">Email o contraseña incorrectos</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Mensaje de éxito después del logout -->
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #00ba7c; background-color: #f0fdf4;">
                            <span style="color: #00ba7c; font-size: 14px;">Sesión cerrada exitosamente</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Mensaje de error OAuth2 -->
                        <div th:if="${param.error == 'oauth2'}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #ed4956; background-color: #ffeef0;">
                            <span style="color: #ed4956; font-size: 14px;">Error al iniciar sesión con Google</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Formulario de login -->
                        <form th:action="@{/login}" method="post">
                            <!-- Campo Email -->
                            <div class="mb-3">
                                <input type="email" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Correo electrónico"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       required>
                            </div>
                            
                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Contraseña"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       required>
                            </div>
                            
                            <!-- Botón de login -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary"
                                        style="background-color: #0095f6; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; height: 44px;">
                                    Iniciar sesión
                                </button>
                            </div>
                        </form>
                        
                        <!-- Divisor "O" -->
                        <div class="text-center my-4" style="position: relative;">
                            <hr style="border-color: #dbdbdb;">
                            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; padding: 0 20px; color: #8e8e8e; font-size: 13px; font-weight: 600;">
                                O
                            </span>
                        </div>
                        
                        <!-- Botón de Google OAuth2 -->
                        <div class="d-grid mb-4">
                            <a th:href="@{/oauth2/authorization/google}" 
                               class="btn btn-google d-flex align-items-center justify-content-center text-decoration-none"
                               style="background-color: #ffffff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; height: 44px; color: #262626; transition: all 0.2s ease;">
                                <svg class="me-2" width="18" height="18" viewBox="0 0 18 18">
                                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18Z"/>
                                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.53H1.83v2.07A8 8 0 0 0 8.98 17Z"/>
                                    <path fill="#FBBC04" d="M4.5 10.49a4.8 4.8 0 0 1 0-3.07V5.35H1.83a8 8 0 0 0 0 7.28l2.67-2.14Z"/>
                                    <path fill="#EA4335" d="M8.98 4.72c1.16 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.35L4.5 7.42a4.77 4.77 0 0 1 4.48-2.7Z"/>
                                </svg>
                                Continuar con Google
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Enlaces adicionales -->
                <div class="text-center mt-4">
                    <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px; padding: 20px;">
                        <p class="mb-0" style="color: #262626; font-size: 14px;">
                            ¿No tienes una cuenta? 
                            <a th:href="@{/usuarios/registro}" class="text-decoration-none" style="color: #0095f6; font-weight: 600;">
                                Regístrate
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
