<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Cuenta Eliminada - TuReserva</title>
    <meta http-equiv="refresh" content="5;url=/logout">
</head>

<div layout:fragment="content">
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card text-center shadow">
                    <div class="card-body py-5">
                        <!-- Icono de éxito -->
                        <div class="text-success mb-4">
                            <i class="bi bi-check-circle-fill" style="font-size: 4rem;"></i>
                        </div>
                        
                        <!-- Título -->
                        <h2 class="card-title text-success mb-3">¡Cuenta Eliminada!</h2>
                        
                        <!-- Mensaje -->
                        <p class="card-text text-muted mb-4">
                            Tu cuenta ha sido eliminada exitosamente. Lamentamos verte partir.
                        </p>
                        
                        <!-- Información adicional -->
                        <div class="alert alert-info alert-dismissible fade show" role="alert">
                            <i class="bi bi-info-circle me-2"></i>
                            Serás redirigido automáticamente en <span id="countdown">5</span> segundos.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        
                        <!-- Botones -->
                        <div class="d-grid gap-2">
                            <!-- Formulario para logout manual -->
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-box-arrow-right me-2"></i>Salir Ahora
                                </button>
                            </form>
                            
                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                <i class="bi bi-house me-2"></i>Ir al Inicio
                            </a>
                        </div>
                        
                        <!-- Mensaje de agradecimiento -->
                        <div class="mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                <i class="bi bi-heart me-1"></i>
                                Gracias por haber sido parte de TuReserva. 
                                Siempre serás bienvenido de regreso.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <!-- Script para countdown -->
    <script>
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(interval);
                // Enviar formulario de logout automáticamente
                document.querySelector('form').submit();
            }
        }, 1000);
    </script>
</th:block>
