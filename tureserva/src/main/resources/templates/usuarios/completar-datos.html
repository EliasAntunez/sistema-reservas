<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Completar Datos</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px;">
                    <div class="card-body p-4">
                        <!-- Título del formulario -->
                        <div class="text-center mb-4">
                            <h1 class="fw-light mb-3" style="font-size: 2rem; font-family: 'Segoe UI', system-ui, sans-serif;">¡Bienvenido!</h1>
                            <p class="text-muted" style="font-size: 16px; color: #8e8e8e;">Para completar tu registro, necesitamos algunos datos adicionales</p>
                        </div>
                        
                        <!-- Mensaje de error -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 8px; border: 1px solid #ed4956; background-color: #ffeef0;">
                            <span th:text="${error}" style="color: #ed4956; font-size: 14px;"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <!-- Formulario de completar datos -->
                        <form th:action="@{/completar-datos}" method="post">
                            <!-- Información del usuario (solo lectura) -->
                            <div class="mb-3">
                                <label class="form-label" style="color: #262626; font-size: 14px; font-weight: 600;">Nombre completo</label>
                                <input type="text" 
                                       class="form-control" 
                                       th:value="${cliente.nombre + ' ' + cliente.apellido}"
                                       style="background-color: #f5f5f5; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #8e8e8e;"
                                       readonly>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label" style="color: #262626; font-size: 14px; font-weight: 600;">Email</label>
                                <input type="email" 
                                       class="form-control" 
                                       th:value="${cliente.email}"
                                       style="background-color: #f5f5f5; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #8e8e8e;"
                                       readonly>
                            </div>
                            
                            <!-- Campo DNI (obligatorio) -->
                            <div class="mb-3">
                                <label for="dni" class="form-label" style="color: #262626; font-size: 14px; font-weight: 600;">DNI *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="dni" 
                                       name="dni" 
                                       placeholder="Ingresa tu DNI (solo números, 7-8 dígitos)"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       pattern="[0-9]{7,8}"
                                       maxlength="8"
                                       title="El DNI debe contener entre 7 y 8 dígitos numéricos"
                                       required>
                                <small class="text-muted" id="dni-ayuda">Necesitamos tu DNI para completar tu registro</small>
                                <div class="invalid-feedback" id="dni-error" style="display: none; color: #ed4956; font-size: 12px; margin-top: 4px;">
                                    El DNI debe contener solo números y tener entre 7 y 8 dígitos
                                </div>
                            </div>
                            
                            <!-- Campo Teléfono (opcional) -->
                            <div class="mb-4">
                                <label for="telefono" class="form-label" style="color: #262626; font-size: 14px; font-weight: 600;">Teléfono (opcional)</label>
                                <input type="tel" 
                                       class="form-control" 
                                       id="telefono" 
                                       name="telefono" 
                                       placeholder="Ingresa tu teléfono"
                                       style="background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #262626;"
                                       maxlength="20">
                            </div>
                            
                            <!-- Botón de completar -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="btnCompletar"
                                        style="background-color: #0095f6; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; height: 44px;">
                                    Completar registro
                                </button>
                            </div>
                        </form>
                        
                        <!-- Script de validación DNI -->
                        <script th:inline="javascript">
                            document.addEventListener('DOMContentLoaded', function() {
                                const dniInput = document.getElementById('dni');
                                const dniError = document.getElementById('dni-error');
                                const dniAyuda = document.getElementById('dni-ayuda');
                                const form = dniInput.closest('form');
                                
                                // Validación en tiempo real mientras escribe
                                dniInput.addEventListener('input', function(e) {
                                    // Eliminar cualquier caracter que no sea número
                                    this.value = this.value.replace(/[^0-9]/g, '');
                                    
                                    // Validar en tiempo real
                                    validarDNI();
                                });
                                
                                // Validación al perder el foco
                                dniInput.addEventListener('blur', function() {
                                    if (this.value.length > 0) {
                                        validarDNI();
                                    }
                                });
                                
                                // Validación antes de enviar el formulario
                                form.addEventListener('submit', function(e) {
                                    if (!validarDNI()) {
                                        e.preventDefault();
                                        dniInput.focus();
                                    }
                                });
                                
                                function validarDNI() {
                                    const valor = dniInput.value.trim();
                                    
                                    // Validar que tenga entre 7 y 8 dígitos
                                    if (valor.length === 0) {
                                        mostrarError('El DNI es obligatorio');
                                        return false;
                                    }
                                    
                                    if (!/^[0-9]{7,8}$/.test(valor)) {
                                        mostrarError('El DNI debe contener entre 7 y 8 dígitos numéricos');
                                        return false;
                                    }
                                    
                                    // DNI válido
                                    ocultarError();
                                    return true;
                                }
                                
                                function mostrarError(mensaje) {
                                    dniInput.classList.add('is-invalid');
                                    dniInput.style.borderColor = '#ed4956';
                                    dniError.textContent = mensaje;
                                    dniError.style.display = 'block';
                                    dniAyuda.style.display = 'none';
                                }
                                
                                function ocultarError() {
                                    dniInput.classList.remove('is-invalid');
                                    dniInput.style.borderColor = '#dbdbdb';
                                    dniError.style.display = 'none';
                                    dniAyuda.style.display = 'block';
                                }
                            });
                        </script>
                    </div>
                </div>
                
                <!-- Información adicional -->
                <div class="text-center mt-4">
                    <div class="card" style="border: 1px solid #dbdbdb; border-radius: 12px; padding: 15px;">
                        <p class="mb-0" style="color: #8e8e8e; font-size: 12px;">
                            <i class="fas fa-shield-alt me-1"></i>
                            Tus datos están seguros y solo se utilizan para mejorar tu experiencia
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
