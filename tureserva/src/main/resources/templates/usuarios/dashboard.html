<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Dashboard</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row">
            <!-- Bienvenida -->
            <div class="col-12">
                <div class="jumbotron bg-primary-unified text-white p-5 rounded shadow-sm mb-4">
                    <h1 class="display-4">
                        <i class="bi bi-person-circle me-3"></i>¡Bienvenido a TuReserva!
                    </h1>
                    <hr class="my-4">
                    <p><i class="bi bi-calendar-event me-2"></i>Desde aquí podrás gestionar tus reservas y configurar tu perfil.</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- Panel de acciones rápidas -->
            <div class="col-md-4">
                <div class="card card-unified shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-calendar-plus fa-3x text-primary-unified mb-3"></i>
                        <h5>Nueva Reserva</h5>
                        <p class="text-muted-unified">Crear una nueva reserva</p>
                        <a th:href="@{/reservas/nueva}" class="btn btn-primary-unified">
                            Reservar Ahora
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card card-unified shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-list fa-3x text-success mb-3"></i>
                        <h5>Mis Reservas</h5>
                        <p class="text-muted-unified">Ver reservas existentes</p>
                        <a th:href="@{/reservas/mis-reservas}" class="btn btn-success-unified">
                            Mis Reservas
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card card-unified shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-user-cog fa-3x text-accent mb-3"></i>
                        <h5>Mi Perfil</h5>
                        <p class="text-muted-unified">Configurar perfil</p>
                        <a href="/perfil" class="btn btn-accent">
                            Configurar Perfil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
