<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éxito - TuReserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <i class="bi bi-check-circle text-success" style="font-size: 5rem;"></i>
                        </div>
                        <h2 class="mb-3" th:text="${mensaje}">Operación exitosa</h2>
                        
                        <div class="info-box text-start">
                            <h5 class="mb-3">Detalles de tu reserva:</h5>
                            
                            <!-- Si es una reprogramación, mostrar info de ambas reservas -->
                            <div th:if="${reservaOriginal}">
                                <div class="alert alert-info mb-3">
                                    <i class="bi bi-info-circle me-2"></i>
                                    <strong>Reserva reprogramada:</strong><br/>
                                    La reserva original <span th:text="${reservaOriginal.codigoReserva}"></span> 
                                    ha sido marcada como reprogramada.<br/>
                                    Tu nueva reserva es: <span th:text="${reserva.codigoReserva}"></span>
                                </div>
                            </div>
                            
                            <p class="mb-2">
                                <strong>Código de reserva:</strong> <span th:text="${reserva.codigoReserva}"></span>
                            </p>
                            <p class="mb-2" th:if="${nuevaFecha}">
                                <strong>Nueva fecha:</strong> <span th:text="${#temporals.format(nuevaFecha, 'dd/MM/yyyy')}"></span>
                            </p>
                            <p class="mb-2" th:if="${nuevaHora}">
                                <strong>Nueva hora:</strong> <span th:text="${#temporals.format(nuevaHora, 'HH:mm')}"></span>
                            </p>
                            <p class="mb-2" th:unless="${nuevaFecha}">
                                <strong>Fecha:</strong> <span th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')}"></span>
                            </p>
                            <p class="mb-2">
                                <strong>Estado:</strong> 
                                <span class="badge" 
                                      th:classappend="'bg-' + ${reserva.estado.badgeClass}"
                                      th:text="${reserva.estado.displayName}"></span>
                            </p>
                        </div>
                        
                        <div class="alert alert-info mt-4">
                            <i class="bi bi-info-circle me-2"></i>
                            Puedes ver todos los detalles de tu reserva iniciando sesión en la plataforma.
                        </div>
                        
                        <a href="https://nonemulous-tod-baggily.ngrok-free.dev/login" class="btn btn-primary btn-lg mt-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
