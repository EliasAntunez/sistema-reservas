<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Nuevo Complejo Deportivo</title>
    <link rel="stylesheet" th:href="@{/css/buscador-direcciones.css}">
</head>
<body>
    <div layout:fragment="content" class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-building"></i>
                            Crear Nuevo Complejo Deportivo
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Mostrar mensajes de error -->
                        <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:text="${mensajeError}"></span>
                        </div>

                        <form id="formComplejo" th:action="@{/super-admin/complejos/crear}" method="post">
                            <div class="row">
                                <!-- Información Básica -->
                                <div class="col-12 mb-4">
                                    <h6 class="fw-bold text-primary">Información Básica</h6>
                                </div>

                                <!-- Nombre del Complejo -->
                                <div class="col-md-6 mb-3">
                                    <label for="nombreComplejo" class="form-label">
                                        Nombre del Complejo <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="nombreComplejo" 
                                           name="nombreComplejo" 
                                           required="required"
                                           minlength="3"
                                           maxlength="100"
                                           placeholder="Ej: Complejo Deportivo Central" />
                                    <div class="form-text">Nombre identificatorio del complejo</div>
                                </div>

                                <!-- Administrador -->
                                <div class="col-md-6 mb-3">
                                    <label for="administradorId" class="form-label">
                                        Administrador <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" 
                                            id="administradorId" 
                                            name="administradorId" 
                                            required="required">
                                        <option value="">Seleccione un administrador</option>
                                        <option th:each="admin : ${administradores}" 
                                                th:value="${admin.id}" 
                                                th:text="${admin.nombre} + ' ' + ${admin.apellido}"></option>
                                    </select>
                                    <div class="form-text">Responsable del complejo</div>
                                </div>

                                <!-- Localidad (se auto-completa según ubicación) -->
                                <div class="col-md-6 mb-3">
                                    <label for="localidadId" class="form-label">
                                        Localidad <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" 
                                            id="localidadSelect" 
                                            name="localidadId" 
                                            required="required"
                                            disabled>
                                        <option value="">Seleccione una dirección primero</option>
                                        <option th:each="localidad : ${localidades}" 
                                                th:value="${localidad.id}" 
                                                th:text="${localidad.nombre}"></option>
                                    </select>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle"></i> 
                                        Se selecciona automáticamente según la dirección ingresada
                                    </div>
                                </div>

                                <!-- Buscador de Dirección con Autocompletado -->
                                <div class="col-12 mb-3">
                                    <label for="direccionBuscador" class="form-label">
                                        Buscar Dirección <span class="text-danger">*</span>
                                    </label>
                                    <div class="position-relative">
                                        <input type="text" 
                                               id="direccionBuscador" 
                                               class="form-control" 
                                               placeholder="Ej: Av. Costanera 1234, Posadas, Misiones"
                                               autocomplete="off">
                                        <ul id="sugerenciasDireccion" 
                                            class="list-group position-absolute w-100 shadow-sm" 
                                            style="max-height: 300px; overflow-y: auto; z-index: 1050; display: none;">
                                        </ul>
                                    </div>
                                    <small class="text-muted">Escribe para buscar la dirección y selecciona una sugerencia</small>
                                </div>

                                <!-- Campos hidden para latitud y longitud -->
                                <input type="hidden" name="latitud" id="latitud">
                                <input type="hidden" name="longitud" id="longitud">

                                <!-- Campo de dirección completa (readonly, se llena automáticamente) -->
                                <div class="col-12 mb-3">
                                    <label for="direccionComplejo" class="form-label">
                                        Dirección Seleccionada <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="direccionComplejo" 
                                           name="direccionComplejo" 
                                           required="required"
                                           minlength="5"
                                           maxlength="255"
                                           readonly
                                           placeholder="Se llenará al seleccionar una dirección del buscador" />
                                    <div class="form-text">Dirección física del complejo (se completa automáticamente)</div>
                                </div>

                                <!-- Mensaje de validación de cobertura -->
                                <div class="col-12 mb-3">
                                    <div id="mensajeCobertura" class="alert d-none" role="alert">
                                        <strong id="coberturaTexto"></strong>
                                    </div>
                                </div>

                                <!-- Campo hidden para localidadId (se llena automáticamente) -->
                                <input type="hidden" name="localidadId" id="localidadId">
                                
                                <!-- Token CSRF para peticiones AJAX -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            </div>

                            <!-- Botones -->
                            <div class="row mt-4">
                                <div class="col-12">
                                    <div class="d-flex justify-content-between">
                                        <a th:href="@{/super-admin/complejos/listar}" 
                                           class="btn btn-secondary">
                                            <i class="fas fa-arrow-left"></i> Volver
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save"></i> Crear Complejo
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script layout:fragment="scripts">
        // ==================== BUSCADOR DE DIRECCIONES CON NOMINATIM ====================
        (function() {
            'use strict';

            const buscadorInput = document.getElementById('direccionBuscador');
            const sugerenciasUl = document.getElementById('sugerenciasDireccion');
            const latitudInput = document.getElementById('latitud');
            const longitudInput = document.getElementById('longitud');
            const direccionInput = document.getElementById('direccionComplejo');

            let debounceTimer;
            const DEBOUNCE_DELAY = 500; // 500ms

            if (!buscadorInput || !sugerenciasUl) {
                console.warn('Elementos del buscador de direcciones no encontrados');
                return;
            }

            // Event listener para el input con debounce
            buscadorInput.addEventListener('input', function(e) {
                const query = e.target.value.trim();

                // Limpiar timer anterior
                clearTimeout(debounceTimer);

                // Si el input está vacío, limpiar sugerencias
                if (query.length === 0) {
                    limpiarSugerencias();
                    return;
                }

                // Si tiene menos de 3 caracteres, no buscar aún
                if (query.length < 3) {
                    return;
                }

                // Establecer nuevo timer para debounce
                debounceTimer = setTimeout(function() {
                    buscarDirecciones(query);
                }, DEBOUNCE_DELAY);
            });

            // Función para buscar direcciones en Nominatim
            function buscarDirecciones(query) {
                // Mostrar indicador de carga
                sugerenciasUl.innerHTML = '<li class="list-group-item text-muted"><i>Buscando...</i></li>';
                sugerenciasUl.style.display = 'block';

                // Construir URL con parámetros
                const params = new URLSearchParams({
                    q: query,
                    format: 'json',
                    addressdetails: '1',
                    limit: '5',
                    countrycodes: 'ar' // Limitar a Argentina
                });

                const url = `https://nominatim.openstreetmap.org/search?${params.toString()}`;

                fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la respuesta de Nominatim');
                    }
                    return response.json();
                })
                .then(data => {
                    mostrarSugerencias(data);
                })
                .catch(error => {
                    console.error('Error al buscar direcciones:', error);
                    sugerenciasUl.innerHTML = '<li class="list-group-item text-danger">Error al buscar. Intenta nuevamente.</li>';
                });
            }

            // Función para mostrar las sugerencias
            function mostrarSugerencias(resultados) {
                sugerenciasUl.innerHTML = '';

                if (resultados.length === 0) {
                    sugerenciasUl.innerHTML = '<li class="list-group-item text-muted">No se encontraron resultados</li>';
                    sugerenciasUl.style.display = 'block';
                    return;
                }

                resultados.forEach(function(resultado) {
                    const li = document.createElement('li');
                    li.className = 'list-group-item list-group-item-action';
                    li.style.cursor = 'pointer';
                    li.textContent = resultado.display_name;

                    // Almacenar datos en el elemento
                    li.dataset.lat = resultado.lat;
                    li.dataset.lon = resultado.lon;
                    li.dataset.displayName = resultado.display_name;

                    // Event listener para selección
                    li.addEventListener('click', function() {
                        seleccionarDireccion(this);
                    });

                    sugerenciasUl.appendChild(li);
                });

                sugerenciasUl.style.display = 'block';
            }

            // Función para seleccionar una dirección
            function seleccionarDireccion(elemento) {
                const lat = elemento.dataset.lat;
                const lon = elemento.dataset.lon;
                const displayName = elemento.dataset.displayName;

                // Rellenar campos
                buscadorInput.value = displayName;
                direccionInput.value = displayName;
                latitudInput.value = lat;
                longitudInput.value = lon;

                // Limpiar sugerencias
                limpiarSugerencias();

                console.log('Dirección seleccionada:', {
                    direccion: displayName,
                    lat: lat,
                    lon: lon
                });

                // Validar cobertura geográfica automáticamente
                validarCoberturaLocalidad(lat, lon);
            }

            // Función para validar si la ubicación está en nuestra área de cobertura
            function validarCoberturaLocalidad(lat, lon) {
                const mensajeDiv = document.getElementById('mensajeCobertura');
                const textoSpan = document.getElementById('coberturaTexto');
                const localidadInput = document.getElementById('localidadId');

                // Mostrar mensaje de validación en progreso
                mensajeDiv.className = 'alert alert-info';
                mensajeDiv.classList.remove('d-none');
                textoSpan.textContent = 'Validando ubicación...';

                // Llamar al endpoint de validación (CSRF deshabilitado para este endpoint)
                fetch('/api/validacion-localidad/validar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        latitud: lat,
                        longitud: lon
                    })
                })
                .then(response => {
                    console.log('Response status:', response.status);
                    if (!response.ok) {
                        if (response.status === 403) {
                            throw new Error('Error de permisos (403). Por favor, recargue la página e intente nuevamente.');
                        }
                        throw new Error('Error en el servidor: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Datos recibidos:', data);
                    
                    if (data.valido) {
                        // Ubicación válida - mostrar mensaje de éxito
                        mensajeDiv.className = 'alert alert-success';
                        textoSpan.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>' + data.mensaje;
                        
                        // Asignar localidadId automáticamente (campo hidden)
                        localidadInput.value = data.localidadId;
                        
                        // Pre-seleccionar en el select visual y habilitarlo
                        const localidadSelect = document.getElementById('localidadSelect');
                        localidadSelect.value = data.localidadId;
                        localidadSelect.disabled = false;
                        localidadSelect.classList.remove('text-muted');
                        
                        console.log('Cobertura válida. LocalidadId asignado:', data.localidadId, 'Localidad:', data.nombreLocalidad);
                    } else {
                        // Ubicación fuera de cobertura - mostrar error y limpiar campos
                        mensajeDiv.className = 'alert alert-danger';
                        textoSpan.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>' + data.mensaje;
                        
                        // Limpiar campos porque no podemos crear el complejo aquí
                        direccionInput.value = '';
                        latitudInput.value = '';
                        longitudInput.value = '';
                        localidadInput.value = '';
                        
                        // Deshabilitar y limpiar select de localidad
                        const localidadSelect = document.getElementById('localidadSelect');
                        localidadSelect.value = '';
                        localidadSelect.disabled = true;
                        localidadSelect.classList.add('text-muted');
                        
                        console.warn('Ubicación fuera de cobertura:', data.mensaje);
                    }
                })
                .catch(error => {
                    console.error('Error al validar cobertura:', error);
                    mensajeDiv.className = 'alert alert-danger';
                    textoSpan.innerHTML = '<i class="bi bi-exclamation-circle-fill me-2"></i>' + error.message;
                    
                    // Limpiar campos por seguridad
                    direccionInput.value = '';
                    latitudInput.value = '';
                    longitudInput.value = '';
                    localidadInput.value = '';
                });
            }

            // Función para limpiar sugerencias
            function limpiarSugerencias() {
                sugerenciasUl.innerHTML = '';
                sugerenciasUl.style.display = 'none';
            }

            // Cerrar sugerencias al hacer clic fuera
            document.addEventListener('click', function(e) {
                if (e.target !== buscadorInput && e.target !== sugerenciasUl && !sugerenciasUl.contains(e.target)) {
                    limpiarSugerencias();
                }
            });

            // Prevenir que el formulario se envíe al presionar Enter en el buscador
            buscadorInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });

        })();

        // ==================== VALIDACIÓN DEL FORMULARIO ====================
        document.getElementById('formComplejo').addEventListener('submit', function(e) {
            const nombreComplejo = document.getElementById('nombreComplejo').value.trim();
            const direccionComplejo = document.getElementById('direccionComplejo').value.trim();
            const latitud = document.getElementById('latitud').value;
            const longitud = document.getElementById('longitud').value;
            const administradorId = document.getElementById('administradorId').value;

            // Validar campos obligatorios básicos
            if (!nombreComplejo || !administradorId) {
                e.preventDefault();
                alert('El nombre del complejo y el administrador son obligatorios.');
                return false;
            }

            if (nombreComplejo.length < 3) {
                e.preventDefault();
                alert('El nombre del complejo debe tener al menos 3 caracteres.');
                return false;
            }

            // Validar que se haya usado el buscador de direcciones
            if (!direccionComplejo || !latitud || !longitud) {
                e.preventDefault();
                alert('Debes buscar y seleccionar una dirección usando el buscador para obtener las coordenadas geográficas.');
                return false;
            }

            if (direccionComplejo.length < 5) {
                e.preventDefault();
                alert('La dirección debe tener al menos 5 caracteres.');
                return false;
            }

            return true;
        });
    </script>
</body>
</html>
