<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Dashboard - Super Administrador</title>
</head>

<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row">
            <!-- Bienvenida -->
            <div class="col-12">
                <div class="jumbotron bg-primary text-white p-5 rounded shadow-sm mb-4">
                    <h1 class="display-4">¡Bienvenido Super Administrador!</h1>
                    <p class="lead" th:if="${superAdmin}">
                        Hola <strong th:text="${superAdmin.nombre + ' ' + superAdmin.apellido}">Super Admin</strong>
                    </p>
                    <hr class="my-4">
                    <p>Panel de administración principal del sistema TuReserva.</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <!-- Panel de gestión -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-users-cog fa-3x text-primary mb-3"></i>
                        <h5>Administradores</h5>
                        <p class="text-muted">Gestionar administradores de complejos</p>
                        <button class="btn btn-primary" disabled>
                            Próximamente
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-building fa-3x text-success mb-3"></i>
                        <h5>Complejos Deportivos</h5>
                        <p class="text-muted">Ver y gestionar complejos</p>
                        <button class="btn btn-success" disabled>
                            Próximamente
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-user-cog fa-3x text-warning mb-3"></i>
                        <h5>Mi Perfil</h5>
                        <p class="text-muted">Configurar perfil</p>
                        <a href="/super-admin/perfil" class="btn btn-warning">
                            Ver Perfil
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Mensajes de alerta -->
        <div class="row mt-4" th:if="${error}">
            <div class="col-12">
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span th:text="${error}">Error</span>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
